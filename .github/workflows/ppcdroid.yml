name: ppcdroid
on: [workflow_dispatch, push]
jobs:
  ppcdroid-gingerbread-ppc-full_powerpc-userdebug-rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 9999
    steps:
      - name: ppcdroid-gingerbread-ppc-full_powerpc-userdebug-rootfs
        run: |
          sudo rm -rf /usr/src /usr/lib/jvm /home/linuxbrew /home/packer /root /usr/share/dotnet /usr/share/swift /usr/share/miniconda /usr/lib/google-cloud-sdk /var/lib/docker /usr/local /opt /home/runner/.*
          sudo mkdir -p /usr/src /usr/lib/jvm /home/linuxbrew /home/packer /root /usr/share/dotnet /usr/share/swift /usr/share/miniconda /usr/lib/google-cloud-sdk /var/lib/docker /usr/local /opt
          sudo apt --yes --force-yes update
          sudo apt --yes --force-yes install --no-install-suggests --no-install-recommends debootstrap qemu-user-binfmt binfmt-support
          sudo apt --yes --force-yes clean
          sudo apt --yes --force-yes autoclean
          sudo apt --yes --force-yes autoremove
          sudo debootstrap --no-merged-usr --arch=amd64 --variant=minbase --no-check-gpg --no-check-certificate lucid ubuntu-lucid http://old-releases.ubuntu.com/ubuntu
          cd ubuntu-lucid
          sudo rm -rf etc/apt/preferences
          echo "Package: *" | sudo tee etc/apt/preferences
          echo "Pin: release o=*,a=*,n=*,l=*,c=*,b=*" | sudo tee -a etc/apt/preferences
          echo "Pin-Priority: 1001" | sudo tee -a etc/apt/preferences
          sudo rm -rf etc/apt/sources.list
          echo "deb http://old-releases.ubuntu.com/ubuntu lucid-backports restricted main multiverse universe" | sudo tee etc/apt/sources.list
          echo "deb http://old-releases.ubuntu.com/ubuntu lucid restricted main multiverse universe" | sudo tee -a etc/apt/sources.list
          echo "deb http://old-releases.ubuntu.com/ubuntu lucid-proposed restricted main multiverse universe" | sudo tee -a etc/apt/sources.list
          echo "deb http://old-releases.ubuntu.com/ubuntu lucid-security restricted main multiverse universe" | sudo tee -a etc/apt/sources.list
          echo "deb http://old-releases.ubuntu.com/ubuntu lucid-updates restricted main multiverse universe" | sudo tee -a etc/apt/sources.list
          echo "deb-src http://old-releases.ubuntu.com/ubuntu lucid-backports restricted main multiverse universe" | sudo tee -a etc/apt/sources.list
          echo "deb-src http://old-releases.ubuntu.com/ubuntu lucid restricted main multiverse universe" | sudo tee -a etc/apt/sources.list
          echo "deb-src http://old-releases.ubuntu.com/ubuntu lucid-proposed restricted main multiverse universe" | sudo tee -a etc/apt/sources.list
          echo "deb-src http://old-releases.ubuntu.com/ubuntu lucid-security restricted main multiverse universe" | sudo tee -a etc/apt/sources.list
          echo "deb-src http://old-releases.ubuntu.com/ubuntu lucid-updates restricted main multiverse universe" | sudo tee -a etc/apt/sources.list
          sudo chroot . apt-get --yes --force-yes update --allow-unauthenticated
          sudo chroot . apt-get --yes --force-yes dist-upgrade --no-install-recommends
          sudo mount -B /proc proc
          sudo chroot . apt-get --yes --force-yes install --no-install-recommends gcc-multilib g++-multilib make python bzip2 libxml2-utils bison flex imagemagick git-core file ia32-libs perl gperf zip unzip libc6-dev-i386 zlib1g-dev lib32z1-dev libncurses5-dev lib32ncurses5-dev x11proto-core-dev libx11-dev
          sudo chroot . apt-get --yes --force-yes clean
          sudo chroot . apt-get --yes --force-yes autoclean
          sudo chroot . apt-get --yes --force-yes autoremove
          echo "#!/bin/bash" | sudo tee build-ppcdroid.sh
          echo "cd \$1" | sudo tee -a build-ppcdroid.sh
          echo "export PATH=/ppcdroid-javadk/64/jdk1.6.0_45/bin:\$PATH" | sudo tee -a build-ppcdroid.sh
          echo "source build/envsetup.sh" | sudo tee -a build-ppcdroid.sh
          echo "lunch \$2" | sudo tee -a build-ppcdroid.sh
          echo "make -j4 droid" | sudo tee -a build-ppcdroid.sh
          sudo chmod 0777 build-ppcdroid.sh
          sudo git clone --depth=1 --single-branch http://github.com/CE1CECL/JDK ppcdroid-javadk
          sudo git clone --depth=1 --single-branch --branch=gingerbread-ppc http://github.com/CE1CECL/ppcdroid ppcdroid-gingerbread-ppc
          cd ppcdroid-gingerbread-ppc
          sudo rm -rf .git
          sudo chroot .. ../build-ppcdroid.sh $(basename $(pwd)) full_powerpc-userdebug
          sudo cp -rfna out/target/product/generic_powerpc/root out/target/product/generic_powerpc/toor
          sudo cp -rfna out/target/product/generic_powerpc/system out/target/product/generic_powerpc/toor/
          sudo tar -zcvf /ppcdroid-gingerbread-ppc-full_powerpc-userdebug-rootfs.tar.gz -C out/target/product/generic_powerpc/toor/ ./
          sudo rm -rf out
          cd ..
          sudo rm -rf ppcdroid-gingerbread-ppc
          sudo rm -rf build-ppcdroid.sh
          sudo rm -rf ppcdroid-javadk
          sudo umount proc
          cd ..
          sudo rm -rf ubuntu-lucid
          mkdir -p /home/runner/work/ppcdroid/ppcdroid
      - name: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ppcdroid-gingerbread-ppc-full_powerpc-userdebug-rootfs
          path: /ppcdroid-gingerbread-ppc-full_powerpc-userdebug-rootfs.tar.gz
